<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="T6fh9Xc0i_1M81BuUnaSw96loU6tVR8XE3yqR-8PasU" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElitCheats | Premium</title>
    <style>
        body { background-color: #050508; color: #fff; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* HEADER VE LOGO */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.3); border-bottom: 1px solid #1e293b; }
        
        /* LOGO ALEV EFEKTİ */
        .logo { 
            width: 140px; 
            /* Logonun etrafına sürekli yanan neon alev yansıması */
            filter: drop-shadow(0 0 8px #ff4500) drop-shadow(0 0 15px #ff4500); 
            transition: all 0.3s ease;
        }
        .logo:hover { transform: scale(1.1); filter: drop-shadow(0 0 20px #ff4500); }

        .brand-name { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        /* ANA İÇERİK */
        .container { text-align: center; margin-top: 100px; }
        .hero-title { font-size: 48px; text-transform: uppercase; margin-bottom: 20px; }
        .status-badge { background: #10b981; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-name">ELITCHEATS</div>
        <img src="https://i.imgur.com/EGc0kiA.png" class="logo" alt="ElitCheats Logo">
    </div>

    <div class="container">
        <h1 class="hero-title">BLAZING SAILS PREMIUM</h1>
        <div class="status-badge">SİSTEM AKTİF: UNDETECTED</div>
        <p style="color: #64748b; margin-top: 20px;">Sektörün en yeni, en elit hile platformuna hoş geldin.</p>
    </div>

</body>
</html>
