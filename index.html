<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElitCheats | Premium Blazing Sails</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #050508; color: #f1f5f9; text-align: center; padding: 100px 20px; overflow-x: hidden; }

        /* Gelişmiş Neon Başlık */
        h1 { 
            font-size: 56px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; 
            color: #fff; text-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
            animation: glowPulse 2s infinite alternate; margin-bottom: 10px;
        }
        @keyframes glowPulse { from { text-shadow: 0 0 10px #ef4444; } to { text-shadow: 0 0 25px #ef4444, 0 0 40px #ef4444; } }

        /* Geliştirilmiş Kartlar (Glassmorphism) */
        .card { 
            background: rgba(13, 13, 19, 0.6); backdrop-filter: blur(12px);
            border: 1px solid #1e293b; border-radius: 20px; padding: 30px; width: 320px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { border-color: #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); transform: translateY(-10px); }

        /* Modern Butonlar */
        .btn { 
            display: block; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1.5px; transition: all 0.3s;
        }
        .btn-red:hover { background: #b91c1c; transform: scale(1.02); }

        /* Sabit Kutu Tasarımları */
        .video-box, .discord-box { background: rgba(13, 13, 19, 0.8); border: 1px solid #1e293b; border-radius: 16px; padding: 15px; }

        /* Arka Plan Mesh */
        body { background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%); }
    </style>
</head>
<body>
    </body>
</html>
